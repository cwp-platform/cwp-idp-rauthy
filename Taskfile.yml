# cwp-idp-rauthy — Taskfile (go-task). Workflow-паритет с сервисами монорепо.
# Версия — из cwp-infra (CWP_INFRA_REF); форк — IdP, контракты cwp-specs не потребляет (OIDC/OAuth2).

version: '3'

includes:
  cwp:
    taskfile: .cwp-infra/task/cwp.yml
    optional: true
  security:
    taskfile: .cwp-security/Taskfile.yml
    optional: true

vars:
  CWP_INFRA_REF: 'v0.3'

tasks:
  bootstrap:
    silent: true
    desc: "Клонирует/обновляет cwp-infra в .cwp-infra (первый шаг перед cwp:*)"
    cmds:
      - |
        set -e
        if [ -z "${CWP_GH_BASE:-}" ]; then
          for f in ".env" "../.env"; do
            [ -f "$f" ] || continue
            v="$(grep -E '^CWP_GH_BASE=' "$f" 2>/dev/null | head -n1 | cut -d= -f2-)"
            [ -n "$v" ] && { CWP_GH_BASE="$v"; break; }
          done
        fi
        : "${CWP_GH_BASE:?CWP_GH_BASE не задана: окружение (CI) или локальный .env (см. env.example)}"
        INFRA_REPO="${CWP_INFRA_REPO:-${CWP_GH_BASE}/cwp-infra.git}"
        if [ -d .cwp-infra/.git ]; then
          git -C .cwp-infra fetch --depth 1 origin {{.CWP_INFRA_REF}}
          git -c advice.detachedHead=false -C .cwp-infra reset --hard FETCH_HEAD
        else
          rm -rf .cwp-infra
          git -c advice.detachedHead=false clone --depth 1 --branch {{.CWP_INFRA_REF}} "$INFRA_REPO" .cwp-infra
        fi

  build:
    desc: "Сборка rauthy (cargo build)"
    cmds:
      - cargo build --bin rauthy

  build:release:
    desc: "Релизная сборка → out/rauthy_amd64 (упаковывается Dockerfile'ом)"
    cmds:
      - cd frontend && npm install && npm run build
      - cargo run --bin fido-mds-prep -- --source https://mds.fidoalliance.org/ --out assets/fido_mds/dataset.bin
      - cargo build --release --target x86_64-unknown-linux-gnu --bin rauthy
      - mkdir -p out/empty
      - cp target/x86_64-unknown-linux-gnu/release/rauthy out/rauthy_amd64
      - cp target/x86_64-unknown-linux-gnu/release/rauthy target/release/cwp-idp-rauthy

  clean:build:
    desc: "Очистка build-артефактов и локальных кэшей (освобождение диска)"
    cmds:
      - cargo clean
      - rm -rf frontend/node_modules frontend/build out/empty .tools reports normalized-findings.json
