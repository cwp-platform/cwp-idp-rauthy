# Taskfile.yml — сборка cwp-idp-rauthy (единый формат Taskfile репозиториев монорепо).
# Единая точка версии — CWP_INFRA_REF (cwp-infra). Артефакт стенда (rauthy: UI + бинарь)
# собирается НАТИВНО (cargo/npm) на хосте; docker-образ (Dockerfile) лишь ПАКУЕТ готовый
# out/rauthy_amd64 — упаковка вызывается `compose build` ПОСЛЕ этой задачи (deploy-local.sh).
# Внешние builder-образы для сборки не используются.

version: '3'

includes:
  cwp:
    taskfile: .cwp-infra/task/cwp.yml
    optional: true
  security:
    taskfile: .cwp-security/Taskfile.yml
    optional: true

vars:
  CWP_INFRA_REF: 'v0.3'
  RELEASE_TARGET: 'x86_64-unknown-linux-gnu'
  FIDO_MDS_SOURCE: 'https://mds.fidoalliance.org/'
  FIDO_MDS_ASSET: 'assets/fido_mds/dataset.bin'

tasks:
  bootstrap:
    silent: true
    desc: "Клонирует/обновляет cwp-infra в .cwp-infra (первый шаг перед cwp:*)"
    cmds:
      - |
        set -e
        # CWP_GH_BASE: окружение (CI/export) доминирует; иначе — локальные настройки (.env/../.env).
        if [ -z "${CWP_GH_BASE:-}" ]; then
          for f in ".env" "../.env"; do
            [ -f "$f" ] || continue
            v="$(grep -E '^CWP_GH_BASE=' "$f" 2>/dev/null | head -n1 | cut -d= -f2-)"
            [ -n "$v" ] && { CWP_GH_BASE="$v"; break; }
          done
        fi
        : "${CWP_GH_BASE:?CWP_GH_BASE не задана: окружение (CI) или локальный .env (см. env.example)}"
        INFRA_REPO="${CWP_INFRA_REPO:-${CWP_GH_BASE}/cwp-infra.git}"
        if [ -d .cwp-infra/.git ]; then
          git -C .cwp-infra fetch --depth 1 origin {{.CWP_INFRA_REF}}
          git -c advice.detachedHead=false -C .cwp-infra reset --hard FETCH_HEAD
        else
          rm -rf .cwp-infra
          git -c advice.detachedHead=false clone --depth 1 --branch {{.CWP_INFRA_REF}} "$INFRA_REPO" .cwp-infra
        fi

  build:ui:
    silent: true
    desc: "Сборка SPA (vite) → static/v1 + templates/html (встраивается в бинарь rust_embed)"
    cmds:
      - mkdir -p templates/html static/v1
      - rm -rf static/v1/* templates/html/*
      - cd frontend && npm install && npm run build

  fido-mds-prep:
    silent: true
    desc: "FIDO MDS dataset → assets/fido_mds/dataset.bin (нужен релизной сборке)"
    cmds:
      - cargo run --bin fido-mds-prep -- --source {{.FIDO_MDS_SOURCE}} --out {{.FIDO_MDS_ASSET}}

  build:
    silent: true
    desc: "Сборка rauthy (debug): UI + бинарь"
    deps: [build:ui]
    cmds:
      - cargo build --bin rauthy

  build:release:
    silent: true
    desc: "Релизная сборка → out/rauthy_amd64 (упаковывается образом через `compose build`)"
    deps: [build:ui]
    cmds:
      - test -f {{.FIDO_MDS_ASSET}} || task fido-mds-prep
      - cargo build --release --target {{.RELEASE_TARGET}} --bin rauthy
      - mkdir -p out/empty
      - cp target/{{.RELEASE_TARGET}}/release/rauthy out/rauthy_amd64
